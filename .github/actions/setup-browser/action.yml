name: Chromium for selected browser lanes
description: Cache browser binaries by OS, architecture and exact dependency lockfile; always install system libraries.
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      id: chromium
      with:
        path: ~/.cache/ms-playwright
        key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm exec playwright install-deps chromium
      shell: bash
    - if: steps.chromium.outputs.cache-hit != 'true'
      run: pnpm exec playwright install chromium
      shell: bash
