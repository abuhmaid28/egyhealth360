name: Bootstrap CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  POSTGRES_USER: egyhealth
  POSTGRES_PASSWORD: ci-local-only
  POSTGRES_DB: egyhealth
  DATABASE_URL: postgresql://egyhealth:ci-local-only@localhost:5432/egyhealth
  NEXT_TELEMETRY_DISABLED: '1'
  AUTH_BROWSER_ORIGIN: http://localhost:3000
jobs:
  static-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm --filter @egyhealth/db validate
      - run: pnpm build
      - run: pnpm typecheck
      - run: node --test tests/*.test.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui:browser
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@10.34.6
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose -f compose.yaml -f compose.local.yaml up -d --wait postgres
      - run: pnpm test:migrations
      - run: pnpm test:integration
      - run: pnpm test:ui:real
      - run: node scripts/measure-auth.mjs
      - if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down --volumes
  docker-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: docker compose config --quiet
      - run: docker compose build
      # Runtime checks need the schema, not host integration-test fixtures.
      # Own a fresh database; migration/upgrade assertions remain in postgres.
      - run: docker compose -f compose.yaml -f compose.local.yaml up -d --wait postgres
      - name: Deploy schema to the disposable runtime database
        run: docker compose run --rm --no-deps api node packages/db/node_modules/prisma/build/index.js migrate deploy --config packages/db/prisma.config.ts
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T api node --test tests/auth.test.mjs tests/authorization.test.mjs
      - run: docker compose exec -T api node scripts/measure-auth.mjs
      - run: docker compose exec -T api node scripts/verify-auth-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-authorization-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-m1-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-clinical-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-care-action-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-organization-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-patient-entry-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-directory-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-relationship-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-v3-i1-exit-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-availability-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-booking-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-consultation-opening-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-consultation-documentation-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-follow-up-intent-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-v3-i2-exit-runtime.mjs
      - run: docker compose exec -T api node scripts/verify-prescription-runtime.mjs
      - run: |
          curl --fail http://localhost:3000
          curl --fail http://localhost:3001/api/v1/health
      - if: always()
        run: docker compose -f compose.yaml -f compose.local.yaml down --volumes
  # Keep the existing required-check name, including when a dependency fails
  # or is cancelled. Never allow a skipped dependency to produce a green gate.
  validate:
    needs: [static-browser, postgres, docker-runtime]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
